services:
  app:
    ports: !reset []
    extra_hosts: !reset []
    networks:
      default:
        # Chromium requires HTTPS for .app, including Compose's single-label "app".
        aliases: [looninspect.test]
    environment:
      SECURE_COOKIES: "false"
      SCHEDULER_ENABLED: "false"
      UPDATE_CHECK: "false"
      COMMUNITY_SHARING: "false"

  browser:
    environment:
      UPDATE_CHECK: "false"
    build: ./tests/browser
    pull_policy: never
    init: true
    shm_size: 1gb
    command: ["./node_modules/.bin/playwright", "test"]

networks:
  default:
    internal: true
