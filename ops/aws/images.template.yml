AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Image registries for LoonInspect and the IAM role GitHub Actions assumes to
  push to them. One stack per AWS account, deployed once, before anything else
  in ops/aws — the pod stack references these repositories by URI.

Parameters:
  GitHubOidcProviderArn:
    Type: String
    Description: >-
      ARN of the account's existing token.actions.githubusercontent.com OIDC
      provider. Deliberately a parameter rather than a resource: an account can
      hold exactly one provider per issuer URL, and this account already has one
      (created for the LoonInspect_Support / api.loonsec.io deploys). Creating a
      second here would fail; adopting the existing one keeps a single trust
      root for every LoonSecIO repository.
    AllowedPattern: ^arn:aws:iam::\d{12}:oidc-provider/token\.actions\.githubusercontent\.com$

  OidcSubjectPattern:
    Type: String
    Default: repo:LoonSecIO/LoonInspect:ref:refs/heads/main
    Description: >-
      The sub claim pattern this role trusts. The default is main-branch-only,
      which means images publish after merge, never from a PR head. Before
      relying on it, compare against the sub format the Support repo's working
      role trusts — GitHub's sub claim is customizable per org and the format
      actually issued there is the one that is known to pass. Widen to
      repo:LoonSecIO/LoonInspect:* only deliberately, and narrow it back.

Resources:
  # Both repositories are tag-immutable: a pushed tag can never be repointed,
  # so the image a task definition names is the image it will always get. The
  # cost is that there is no moving `latest` — deploys name a commit SHA, which
  # is the discipline we want anyway.
  AppRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: looninspect
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules": [{
            "rulePriority": 1,
            "description": "expire untagged layers after 14 days",
            "selection": {"tagStatus": "untagged", "countType": "sinceImagePushed",
                          "countUnit": "days", "countNumber": 14},
            "action": {"type": "expire"}
          }]}

  DbRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: looninspect-db
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules": [{
            "rulePriority": 1,
            "description": "expire untagged layers after 14 days",
            "selection": {"tagStatus": "untagged", "countType": "sinceImagePushed",
                          "countUnit": "days", "countNumber": 14},
            "action": {"type": "expire"}
          }]}

  # Push-only, and only to the two repositories above. Deploy permissions
  # (ECS, CloudFormation) are deliberately absent: publishing an image and
  # rolling it out are different privileges, and CI holds only the first.
  PushRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: looninspect-ecr-push
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Ref OidcSubjectPattern
      Policies:
        - PolicyName: push-looninspect-images
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # GetAuthorizationToken is account-wide by nature; everything that
              # actually touches image data is scoped to the two repositories.
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource:
                  - !GetAtt AppRepository.Arn
                  - !GetAtt DbRepository.Arn

Outputs:
  PushRoleArn:
    Description: Set this as the AWS_ECR_PUSH_ROLE_ARN repository variable in GitHub.
    Value: !GetAtt PushRole.Arn
  AppRepositoryUri:
    Description: Base URI for app images; deploys append :<git sha>.
    Value: !GetAtt AppRepository.RepositoryUri
  DbRepositoryUri:
    Description: Base URI for database sidecar images; deploys append :<git sha>.
    Value: !GetAtt DbRepository.RepositoryUri
