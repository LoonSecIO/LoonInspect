<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="123.88 180.39 512 512">
  <!-- The favicon mark (#321): public/loon.svg's loon alone, its body, wing and red eye.
       The hexagon frame, the back hexagons and the ripples are removed, not redrawn: at
       16 px they made the mark too busy (2026-09-15). The 512-unit square is 32 units a
       pixel at 16 px; it leaves about a pixel beside the tail and the beak, and puts the
       straight line of the back on a pixel edge at 16, 32 and 48 px.
       One file for both themes. The ink is the fill attribute, which is what a renderer
       without CSS draws; on a dark tab strip the rule below turns it to the paper tone,
       and the eye keeps its red. Not a second file behind a media-gated <link>: Firefox
       ignores `media` on an icon link and takes the last SVG listed, which put a paper
       mark on a light tab.
       favicon.ico has no dark variant: its 16, 32 and 48 px images draw this file over the
       body's outline filled in the paper tone and grown by 1, 1.5 and 2 px, so on a dark
       strip the ink loon keeps a light edge and a light wing. apple-touch-icon.png is this
       file on an opaque paper ground, in a 630-unit square that leaves 14% either side. -->
  <style>@media (prefers-color-scheme: dark) { path { fill: #F6F2E7 } }</style>
