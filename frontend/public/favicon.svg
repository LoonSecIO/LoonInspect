    M 265.49 559.75 Q 265.46 560.32 266.02 560.21 C 267.63 559.87 269.17 560.79 270.59 561.18 Q 307.22 571.18 341.20 561.66 Q 377.26 551.57 402.06 524.78 Q 435.13 489.06 437.08 439.34 Q 437.31 433.52 436.60 425.85 Q 436.05 419.93 435.01 412.40 A 0.62 0.62 0.0 0 0 434.43 411.87 Q 431.92 411.75 428.90 411.68 Q 427.56 411.65 426.64 412.06 Q 426.09 412.30 424.76 413.51 Q 387.87 446.95 265.93 558.70 Q 265.52 559.08 265.49 559.75 Z"/>
