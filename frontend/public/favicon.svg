  <!-- The favicon mark (#321): public/loon.svg without the back hexagons and the
       ripples, which render as grey noise at 16 px. Removed, not redrawn. The 648-unit
       square makes the hexagon exactly 14 px wide at 16 px, so its flat sides land on
       pixel edges.
       One file for both themes. The ink is the fill attribute, which is what a renderer
       without CSS draws; on a dark tab strip the rule below turns it to the paper tone,
       and the eye keeps its red. Not a second file behind a media-gated <link>: Firefox
       ignores `media` on an icon link and takes the last SVG listed, which put a paper
       mark on a light tab. -->
  <style>@media (prefers-color-scheme: dark) { path { fill: #F6F2E7 } }</style>
