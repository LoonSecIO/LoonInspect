[project]
name = "looninspect-backend"
version = "0.1.0"
description = "FastAPI backend for LoonInspect: MDM inventory sync, vulnerability hashing, and SIEM streaming."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "cryptography>=42",
    "alembic>=1.13",
    "argon2-cffi>=23",
]

[dependency-groups]
dev = [
    "ruff>=0.14",
]

[tool.ruff]
# 130 is descriptive of the code as written rather than a target to converge on;
# it exists so E501 catches genuine runaway lines, not the existing style.
line-length = 130
target-version = "py311"
# Alembic revisions are generated output and are never hand-edited.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # import sorting
    "UP",     # pyupgrade
    "B",      # bugbear
    "C4",     # comprehensions
    "SIM",    # simplify
    "ASYNC",  # async correctness
    "RUF",    # ruff-specific
]
ignore = [
    # UP017/UP042 are cosmetic modernisations (datetime.UTC, enum.StrEnum) that
    # touch ~36 sites across feature modules. Deferred to a dedicated change so
    # this one stays reviewable; see #16.
    "UP017",
    "UP042",
    # Flags typographic characters in user-facing copy (e.g. "Devices > Applications"
    # rendered with a real angle quote). Intentional in this codebase.
    "RUF001",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom is a function call in a default argument.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Body",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
