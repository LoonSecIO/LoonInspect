[project]
name = "looninspect-backend"
version = "0.1.0"
description = "FastAPI backend for LoonInspect: MDM inventory sync, vulnerability hashing, and SIEM streaming."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "apscheduler>=3.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
