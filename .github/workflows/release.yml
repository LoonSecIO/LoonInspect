# A published release or prerelease (v2.0.0-rc.1; `releases/latest` skips those) adds its version
# as a tag on the images Publish images pushed for its commit, by digest (ECR forbids moving a tag,
# not adding one), copies those images to ghcr.io/loonsecio under the version, and appends its
# upgrade notes (docs/BRANCHING.md §1.1). The push role trusts v* tags once the maintainer
# redeploys ops/aws/images.template.yml with them (ops/aws/README.md §1). A release runs its tagged
# commit's copy of this file: whoever can push a v* tag can assume that role, so
# .github/rulesets/release-tags.json leaves pushing one to the repository admin role (#672), and a
# release of a commit from before #655 puts nothing on ghcr.io.
name: Release

on:
  release:
    types: [published]

permissions: {}

env:
  TAG: ${{ github.event.release.tag_name }}

jobs:
  images:
    name: Tag the images with the version
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: The tag is a version on a commit of main
        id: version
        run: |
          [[ $TAG =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "::error::$TAG is not a version tag (vMAJOR.MINOR.PATCH, or a prerelease such as v2.0.0-rc.1; docs/BRANCHING.md §1.1), so no image was tagged."; exit 1; }
          sha=$(git rev-parse "$TAG^{commit}")
          git merge-base --is-ancestor "$sha" origin/main || {
            echo "::error::$TAG names $sha, which is not on main, so no image was tagged: releases are cut from main (docs/BRANCHING.md §1.1). Delete this release and its tag, and tag a commit on main."; exit 1; }
          echo "SHA=$sha" >> "$GITHUB_ENV"; echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Assume the ECR push role (it trusts v* tags once ops/aws/images.template.yml is redeployed with them, ops/aws/README.md §1)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - name: Add the version tag to looninspect and looninspect-db
        run: |
          types=(application/vnd.oci.image.index.v1+json application/vnd.docker.distribution.manifest.list.v2+json
                 application/vnd.oci.image.manifest.v1+json application/vnd.docker.distribution.manifest.v2+json)
          # One tag per call: ECR answers one entry per image, so a sha and a version tag on the same image come back as one.
          get() { aws ecr batch-get-image --repository-name "$repo" --image-ids imageTag="$1" --accepted-media-types "${types[@]}" --output json > "$2"; }
          pick() { jq -j "$2 // empty" "$1"; }
          for repo in looninspect looninspect-db; do
            get "$SHA" sha.json; get "$TAG" tag.json
            digest=$(pick sha.json '.images[0].imageId.imageDigest'); tagged=$(pick tag.json '.images[0].imageId.imageDigest')
            if [ -z "$digest" ]; then
              echo "::error::ECR has no $repo:$SHA ($(pick sha.json '.failures[0].failureCode')), so $TAG has nothing to name. Check the Publish images run for $SHA: if it is still going, re-run this workflow once it succeeds; if it failed, was cancelled (a newer push to main cancels a run still waiting its turn) or never ran (it runs only for a commit that changes Dockerfile, backend/, frontend/ or ops/postgres/), run Publish images with 'Use workflow from' set to the tag $TAG, then re-run this workflow."; exit 1
            elif [ "$tagged" = "$digest" ]; then
              echo "::notice::$repo:$TAG already names $digest, the image $SHA built"
            elif [ -n "$tagged" ]; then
              echo "::error::$repo:$TAG already names $tagged, not the image $SHA built ($digest), and ECR tags cannot move. Find what pushed it; publish the next version rather than reuse this one."; exit 1
            else
              pick sha.json '.images[0].imageManifest' > manifest.json
              aws ecr put-image --repository-name "$repo" --image-tag "$TAG" --image-digest "$digest" --image-manifest file://manifest.json \
                --image-manifest-media-type "$(pick sha.json '.images[0].imageManifestMediaType')" > /dev/null
              echo "$repo:$TAG -> $digest, the image $SHA built"
            fi
          done

  ghcr:
    # The public copy (#655): the images main built for this commit, under the version and never
    # as `latest`, so a pull names the release it gets (docker-compose.pull.yml). Copied, not
    # rebuilt: every platform's manifest, layer and provenance is the one ECR holds. The version
    # exists only from this moment, so it is an annotation on the new index, beside the source
    # and revision the image configs carry as labels. No other job holds packages: write.
    name: Copy the images to ghcr.io
    needs: images
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    env:
      SHA: ${{ needs.images.outputs.sha }}
    steps:
      - name: Assume the ECR push role, to read the images
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        id: ecr

      - name: Sign in to ghcr.io with this job's token
        env:
          TOKEN: ${{ github.token }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Copy looninspect and looninspect-db under the version
        env:
          ECR: ${{ steps.ecr.outputs.registry }}
        run: |
          set -o pipefail
          # What an index names: the images a copy keeps, and a different push would not.
          manifests() { docker buildx imagetools inspect --raw "$1" | jq -c '[.manifests[]?.digest] | sort'; }
          for repo in looninspect looninspect-db; do
            src=$ECR/$repo:$TAG dst=ghcr.io/loonsecio/$repo:$TAG
            want=$(manifests "$src") || {
              echo "::error::Could not read $repo:$TAG back from ECR, where the job before this one tagged it; the lines above say why. Re-run this job."; exit 1; }
            if have=$(manifests "$dst" 2>/dev/null); then
              [ "$have" = "$want" ] && { echo "::notice::$dst already names the images $SHA built"; continue; }
              echo "::error::$dst already names other images than the ones $SHA built, and a published version never moves. Find what pushed it; publish the next version rather than reuse this one."; exit 1
            fi
            docker buildx imagetools create --tag "$dst" \
              --annotation "index:org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --annotation "index:org.opencontainers.image.revision=$SHA" \
              --annotation "index:org.opencontainers.image.version=$TAG" "$src" || {
              echo "::error::ghcr.io refused $dst; the lines above say why. 'denied' means this repository may not write that package: if it exists, its settings' Manage Actions access must give LoonSecIO/LoonInspect the Write role (the first push from this job grants that); if it does not, the organization's package settings must let members create packages. Anything else, re-run this job."; exit 1; }
            [ "$(manifests "$dst")" = "$want" ] || {
              echo "::error::$dst was pushed and does not name the images $SHA built. Re-run this job; if it says so again, compare the two with docker buildx imagetools inspect --raw."; exit 1; }
            echo "$dst -> the images $SHA built"
          done

  notes:
    name: Upgrade notes
    if: startsWith(github.event.release.tag_name, 'v')  # no needs: images, so a failed image step does not skip the notes
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Append the migrations since the previous release to the release body
        run: |
          .github/scripts/check_migration_contract.py --notes "$TAG" > notes.md
          body=$(gh release view "$TAG" --json body --jq .body)
          body=${body%%<!-- upgrade notes*}
          printf '%s\n\n%s\n' "${body%"${body##*[![:space:]]}"}" "$(cat notes.md)" > body.md
          gh release edit "$TAG" --notes-file body.md
