# Builds the app image and the database sidecar and pushes both to ECR, tagged
# with the commit SHA and nothing else — the repositories are tag-immutable, so
# there is no moving `latest` to repoint. A deploy names a SHA (see
# ops/aws/README.md), which keeps "what is running" answerable from the tag.
#
# Auth is OIDC, no stored keys: the role comes from ops/aws/images.template.yml
# and its trust policy is main (plus v* tags, for release.yml) by default: dispatching
# this workflow from any other branch will fail at the credentials step by
# design — merge first, or deliberately widen OidcSubjectPattern and narrow it
# back after.
#
# ci.yml stays the correctness gate (build + smoke on every PR); this workflow
# only publishes what main already proved. Nothing here pushes to ghcr.io: a
# release's images go there from release.yml, copied from these, never rebuilt.
name: Publish images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - backend/**
      - frontend/**
      - ops/postgres/**
      - .github/workflows/publish-images.yml

permissions:
  id-token: write
  contents: read

concurrency:
  group: publish-images
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push to ECR
    runs-on: ubuntu-latest
    # A run that works takes under six minutes. One that hangs held GitHub's six-hour
    # default, and every later push's run waited behind it (#714); this fails it with
    # "The job has exceeded the maximum execution time", which
    # docs/troubleshooting.md §10 step 5 answers.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Repository *variables*, not secrets: neither value is sensitive, and
      # variables keep the account id out of a repo that goes public. Run logs
      # are public too, and without masking the account id appears in them a
      # dozen times per run (role ARN, registry host, image tags). The action
      # does not mask it by default, so ask it to: the mask then covers every
      # later line of the job.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        id: ecr

      # Immutable tags make a re-run of an already-published SHA a push error rather than a
      # no-op; skip cleanly instead so re-runs stay green. Checked once per repository — not
      # once for both — so a run that pushes the app image and then dies before the database
      # one still republishes exactly what ECR is missing on its next run, instead of reading
      # the app image's presence as "nothing to do" and skipping the database build forever
      # (#716). Each build step below is gated on its own repository's answer.
      #
      # `describe-images` answers "not there" by failing the call (`ImageNotFoundException`,
      # nonzero exit with no JSON), not by returning an empty result, so a nonzero exit here
      # is not itself "not published" — it is just as often a missing `ecr:DescribeImages`
      # grant, a wrong AWS_REGION, an expired session, or ECR throttling. Reading any of
      # those as "not published" would push into an immutable repository that already holds
      # the image, and fail with an error naming none of the real causes (#694). Only
      # `ImageNotFoundException` reads as "not published"; anything else stops the job with
      # the AWS error and a sentence in the operator's vocabulary
      # (docs/troubleshooting.md §10).
      - name: Check whether each image is already published
        id: exists
        run: |
          check() {
            local repo="$1" out="$2" err
            if err=$(aws ecr describe-images --repository-name "$repo" \
                       --image-ids imageTag="$GITHUB_SHA" 2>&1 >/dev/null); then
              echo "$out=true" >> "$GITHUB_OUTPUT"
              echo "::notice::$repo:$GITHUB_SHA already exists — nothing to do"
            elif grep -q 'ImageNotFoundException' <<<"$err"; then
              echo "$out=false" >> "$GITHUB_OUTPUT"
            else
              echo "$err"
              echo "::error::Checking whether $repo:$GITHUB_SHA is already published failed — that is not the same as not published, it is the question going unanswered (see the line above). Check the push role's ecr:DescribeImages grant on $repo, that AWS_REGION ($AWS_REGION) is where the repository lives, and whether ECR is throttling; docs/troubleshooting.md §10 has the walkthrough."
              exit 1
            fi
          }
          check looninspect app
          check looninspect-db db

      # The runner is linux/amd64 only; building the linux/arm64 half of the
      # manifest below needs emulation registered first. The image that comes
      # out is still native on either architecture — only its arm64 build is
      # emulated, not anything that runs from it — and the frontend is not
      # emulated at all: the Dockerfile builds it once, natively (#714).
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: steps.exists.outputs.app == 'false' || steps.exists.outputs.db == 'false'

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.exists.outputs.app == 'false' || steps.exists.outputs.db == 'false'

      # Multi-arch manifest under one tag: linux/amd64 is what the pod stack's
      # RuntimePlatform (X86_64, see ops/aws/pod.template.yml) actually pulls
      # today; linux/arm64 means anyone who pulls this tag directly on Apple
      # Silicon gets a native image instead of amd64 under emulation.
      - name: Build and push app image
        if: steps.exists.outputs.app == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/looninspect:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # GIT_SHA only labels the image (ops/postgres/Dockerfile): release.yml copies both images
      # to ghcr.io as they are, so the database says which commit built it as the app does.
      - name: Build and push database sidecar image
        if: steps.exists.outputs.db == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ops/postgres
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/looninspect-db:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
