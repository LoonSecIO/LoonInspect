name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A superseded run tells you nothing, so cancel it rather than pay for it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (typecheck + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` fails when package.json and package-lock.json disagree, so this
      # step doubles as the check that the lockfile is current.
      - run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc -b --noEmit

      - name: Lint
        run: npx eslint .

      - name: Build
        run: npm run build

  backend:
    # Renamed from "Backend (ruff)" when the test suite landed. The job's display name
    # is the required-status-check context in .github/rulesets/main.json, so the two
    # have to change together or the ruleset waits forever on a context that no longer
    # reports.
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # The tenancy sweep (#37) tests row-level security, which is the mechanism and not
    # an implementation detail — it cannot be stubbed, so the job now needs a real
    # Postgres. The other tests stay pure and run against it without touching it.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: looninspect
          POSTGRES_PASSWORD: looninspect
          POSTGRES_DB: looninspect
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U looninspect"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.30'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-python@v6
        with:
          python-version-file: backend/.python-version

      # --frozen fails if uv.lock is stale against pyproject.toml, which is the
      # backend half of the lockfile-currency check.
      - name: Install
        run: uv sync --frozen

      - name: Lint
        run: uv run --frozen ruff check --output-format=github .

      # `ruff format --check` is deliberately absent: adopting it today would
      # reformat 20 files across feature modules. Tracked in #16.

      # The app must NOT connect as POSTGRES_USER. initdb creates that role as a
      # superuser, and a superuser bypasses row-level security entirely and silently
      # — every policy stays attached, shows up in \d, and enforces nothing. That is
      # what ops/postgres/initdb/10-app-role.sh exists to prevent in a deployment,
      # and CI has to mirror it or the tenancy sweep passes against no isolation at
      # all. (Verified the hard way: the first run of this job connected as the
      # superuser, and the sweep correctly reported cross-tenant reads returning 200.)
      - name: Create the non-superuser application role
        run: |
          PGPASSWORD=looninspect psql -h localhost -U looninspect -d looninspect \
            -c "CREATE ROLE looninspect_app LOGIN PASSWORD 'looninspect_app' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS" \
            -c "CREATE DATABASE looninspect_test OWNER looninspect_app"

      # RUN_DB_TESTS opts the tenancy sweep in; without it those tests skip, which is
      # what keeps the suite runnable on a laptop with no database. ENCRYPTION_KEY is
      # a throwaway generated per run — the sweep writes credential columns through
      # EncryptedString, and nothing here is persisted beyond the job.
      - name: Test
        env:
          RUN_DB_TESTS: '1'
          DATABASE_URL: postgresql+asyncpg://looninspect_app:looninspect_app@localhost:5432/looninspect_test
        run: |
          export ENCRYPTION_KEY="$(uv run --frozen python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          uv run --frozen pytest -q

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Proves the multi-stage build still works end to end, including that both
      # lockfiles install cleanly under --frozen / `npm ci`.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: looninspect:ci
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image needs a database to reach `healthy` now, and this job runs it
      # standalone rather than through compose — so the database is stood up here
      # explicitly. Without it the app never finishes startup and the job fails on a
      # timeout that looks like a Docker problem rather than a missing dependency.
      - name: Start Postgres
        run: |
          docker network create smoke-net
          # Ephemeral and never published to the host; generated rather than literal
          # so no credential-shaped string lives in the workflow.
          {
            echo "PG_SUPERUSER_PASSWORD=$(openssl rand -hex 16)"
            echo "PG_APP_PASSWORD=$(openssl rand -hex 16)"
          } >> "$GITHUB_ENV"

      - name: Smoke test the image
        run: |
          docker run -d --name smoke-db --network smoke-net \
            -e POSTGRES_DB=looninspect \
            -e POSTGRES_USER=looninspect \
            -e POSTGRES_PASSWORD="$PG_SUPERUSER_PASSWORD" \
            -e POSTGRES_APP_USER=looninspect_app \
            -e POSTGRES_APP_PASSWORD="$PG_APP_PASSWORD" \
            -v "$PWD/ops/postgres/initdb:/docker-entrypoint-initdb.d:ro" \
            postgres:17-alpine

          for i in $(seq 1 30); do
            docker exec smoke-db pg_isready -U looninspect -d looninspect >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec smoke-db pg_isready -U looninspect -d looninspect || {
            echo "::error::database never became ready"; docker logs smoke-db; exit 1; }

          KEY=$(docker run --rm looninspect:ci uv run --frozen --no-dev \
                  python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
          docker run -d --name smoke --network smoke-net \
            -e ENCRYPTION_KEY="$KEY" \
            -e DATABASE_URL="postgresql+asyncpg://looninspect_app:${PG_APP_PASSWORD}@smoke-db:5432/looninspect" \
            -p 8000:8000 looninspect:ci
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' smoke)
            [ "$status" = healthy ] && break
            [ "$status" = unhealthy ] && break
            sleep 2
          done
          echo "health: $status"
          docker exec smoke id | tee /dev/stderr | grep -q 'uid=10001' || {
            echo "::error::image is not running as the non-root looninspect user"; exit 1; }
          [ "$status" = healthy ] || { docker logs smoke; docker logs smoke-db; exit 1; }
          curl -fsS http://localhost:8000/api/health

      # A superuser bypasses row-level security without erroring, so "the policies
      # exist" is not the same claim as "the policies apply". This asserts both: that
      # the role the app connects as cannot bypass them, and that every tenant-scoped
      # table carries an enabled, forced policy.
      - name: Assert tenant isolation is enforceable
        run: |
          docker exec smoke-db psql -U looninspect -d looninspect -tAc \
            "SELECT rolsuper OR rolbypassrls FROM pg_roles WHERE rolname = 'looninspect_app'" \
            | grep -qx f || {
              echo "::error::looninspect_app can bypass RLS — tenant policies would not apply"; exit 1; }

          unforced=$(docker exec smoke-db psql -U looninspect -d looninspect -tAc \
            "SELECT count(*) FROM pg_class c
               JOIN pg_namespace n ON n.oid = c.relnamespace
              WHERE n.nspname = 'public'
                AND c.relkind = 'r'
                AND EXISTS (SELECT 1 FROM pg_attribute a
                             WHERE a.attrelid = c.oid AND a.attname = 'tenant_id' AND a.attnum > 0)
                AND NOT (c.relrowsecurity AND c.relforcerowsecurity)")
          [ "$unforced" = 0 ] || {
            echo "::error::$unforced table(s) with tenant_id are missing forced row-level security"; exit 1; }
