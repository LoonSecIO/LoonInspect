name: Secret scan

# Satisfies the scanner half of CM-03. GitHub's own secret scanning and push
# protection are unavailable here (free plan, private repository — see
# docs/BRANCHING.md §8.1), so this is the substitute. It detects rather than
# prevents: by the time this job fails, the secret is already in remote history
# and must be rotated. .githooks/pre-commit is the preventive half.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly full-history sweep. Everything committed before this workflow
    # existed has never been scanned, and a scheduled run is the only trigger
    # that looks at it.
    - cron: '17 4 * * 1'

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    name: TruffleHog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # A diff scan needs both endpoints of the range; a scheduled full scan
          # needs everything. Cheaper to fetch it all than to branch on trigger.
          fetch-depth: 0

      # fetch-depth: 0 means "all of refs/heads and tags" — it does NOT mean all
      # refs. Publication exposes refs/pull/* too, and those outnumber the branch
      # heads roughly twenty to one here, with most PR head commits never becoming
      # ancestors of main. Without this the weekly sweep has structurally never seen
      # the majority of what going public will expose (INSPECT-0175).
      - name: Fetch pull-request refs for the full sweep
        if: github.event_name == 'schedule'
        run: git fetch --quiet origin '+refs/pull/*/head:refs/remotes/origin/pr/*'

      - name: Scan
        uses: trufflesecurity/trufflehog@bcfcf73aaf4759d4dadc2783177c245a02792318 # v3.97.0
        with:
          # Empty base and head make the action pick the right range per event:
          # the PR's merge base on pull_request, the pushed range on push, and
          # full history on schedule.
          base: ''
          head: ''
          # --only-verified: report a finding only when the candidate proves live
          # against its provider. Unverified matches are noisy enough that a
          # blocking job carrying them trains people to ignore it. The trade-off
          # is that verification sends candidates to third-party APIs — see #24.
          #
          # Know what this does not cover: a credential with no provider to check
          # against — a Fernet ENCRYPTION_KEY, a Postgres password, a Splunk HEC
          # token, a Jamf client secret — can never verify, so it never fails this
          # job however plainly it is committed. That is the right trade for a
          # blocking gate and the wrong one for an audit, which is why the
          # pre-publication sweep in docs/BRANCHING.md §8.2 runs without it.
          #
          # --fail does not belong here: the action already passes it to the CLI,
          # and the flag cannot be repeated. The job still fails on a finding.
          extra_args: --only-verified
