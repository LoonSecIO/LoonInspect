# Builds, signs and notarizes LoonInspect.app, and puts it on a release (macos/README.md).
#
# This repository's releases are immutable: a published release takes no more files. So the
# files go onto a DRAFT, before publication. A manual run from main with a tag builds main's
# head, notarizes it and makes the draft release for that tag, holding the disk image, the zip
# and SHA256SUMS; the repository admin reads the draft and publishes it, and publishing creates
# the tag at that commit (the release-tags ruleset leaves that to the admin role) and starts
# release.yml. A manual run without a tag keeps the files as workflow artifacts only. When a
# release is published, this workflow only checks that it carries the files: it cannot add them.
name: macOS release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          The version to draft a release for: v1.2.0, or a candidate such as v1.2.0-rc.1.
          Leave empty to build and notarize without touching any release.
        required: false
        type: string
  release:
    types: [published]
  pull_request:
    branches: [main]
    paths:
      - 'macos/**'
      - '.github/workflows/macos-release.yml'

permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scripts:
    name: macOS release script tests
    if: github.event_name != 'release'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: for script in macos/scripts/*.sh; do bash -n "$script"; done
      - run: python3 macos/tests/test_notarize.py
      - run: python3 macos/tests/test_release_assets.py
      - run: bash macos/tests/run-shell-tests.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: github.event_name == 'pull_request'
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: github.event_name == 'pull_request'
        with:
          version: '0.9.30'
          enable-cache: false
      - name: Prove the hosted build without release credentials
        if: github.event_name == 'pull_request'
        env:
          SIGN_IDENTITY: '-'
          REQUIRE_CLEAN_TREE: '1'
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          macos/scripts/build-app.sh

  notarize:
    name: Build, sign and notarize
    needs: scripts
    # PRs run isolated script tests only. Signing runs are manual and use main. A publication
    # does not build: by then the release can take no files, so the build comes first.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 150
    environment: macos-release
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    env:
      EXPECTED_TEAM_ID: 6CWZ5GA79H
      TAG: ${{ inputs.tag }}
      BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
      REQUIRE_DEVELOPER_ID: '1'
      REQUIRE_CLEAN_TREE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source and release version before importing credentials
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor HEAD origin/main || {
            echo '::error::This commit is not on main. Run the workflow from main.'; exit 1; }
          version=$(plutil -extract CFBundleShortVersionString raw -o - macos/shell/Info.plist)
          backend=$(sed -n 's/^RELEASE = "\(.*\)"$/\1/p' backend/app/core/version.py)
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && [ "$backend" = "v$version" ] || {
            echo '::error::The app and backend release versions differ. Update Info.plist and backend RELEASE together before building.'; exit 1; }
          if [ -n "$TAG" ]; then
            [[ $TAG =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]] && [ "${TAG%%-*}" = "v$version" ] || {
              echo "::error::The release tag does not match the app version: this commit builds $version, and '$TAG' is not v$version or a candidate of it (v$version-rc.1). Run the workflow again with a tag for this version, or move the version in a pull request first."; exit 1; }
            # Said here, before the build and Apple's wait, so a tag that cannot be used costs a minute rather than an hour;
            # the draft job asks GitHub the same question again, since a tag can appear while this one runs.
            if tagged=$(git rev-parse -q --verify "refs/tags/$TAG^{commit}"); then
              [ "$tagged" = "$(git rev-parse HEAD)" ] || {
                echo "::error::The tag $TAG already names $tagged, not $(git rev-parse HEAD), the commit this run would build, and a published tag never moves. Run the workflow again with the next version (after a candidate, the next -rc.N)."; exit 1; }
            fi
            # A failed question here is not an answer, and is left for the draft job to settle.
            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --silent 2>/dev/null; then
              echo "::error::$TAG is already published, and a published release here takes no more files (this repository's releases are immutable). Run the workflow again with the next version (after a candidate, the next -rc.N)."; exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.9.30'
          enable-cache: false
      - name: Select the runner's Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          swift --version
          [ "$(uname -m)" = arm64 ]

      - name: Import signing and notarization credentials into a temporary keychain
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          NOTARY_AUTH: ${{ vars.APPLE_NOTARY_AUTH || 'apple-id' }}
        run: |
          set -euo pipefail
          umask 077
          [ -n "$CERTIFICATE_BASE64" ] && [ -n "$CERTIFICATE_PASSWORD" ] || {
            echo '::error::Missing MACOS_CERTIFICATE_BASE64 or MACOS_CERTIFICATE_PASSWORD in environment macos-release; see macos/README.md.'; exit 1; }
          credentials="$RUNNER_TEMP/looninspect-signing"
          mkdir -p "$credentials"
          # codesign's private-key lookup also needs the temporary keychain in the search list.
          security list-keychains -d user | sed 's/^[[:space:]]*"//; s/"[[:space:]]*$//' > "$credentials/original-keychains"
          keychain="$credentials/signing.keychain-db"
          password=$(openssl rand -hex 32)
          echo "::add-mask::$password"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$credentials/signing.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 10800 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          keychains=()
          while IFS= read -r entry; do keychains+=("$entry"); done < "$credentials/original-keychains"
          security list-keychains -d user -s "$keychain" "${keychains[@]}"
          security import "$credentials/signing.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          identity=$(security find-identity -v -p codesigning "$keychain" |
            sed -n "s/.*) \([A-F0-9]\{40\}\) \"Developer ID Application: .*($EXPECTED_TEAM_ID)\"/\1/p")
          [[ $identity =~ ^[A-F0-9]{40}$ ]] || {
            echo '::error::The P12 must contain exactly one Developer ID Application identity for the expected team, including its private key.'; exit 1; }
          if [ "$NOTARY_AUTH" = api-key ]; then
            [ -n "$API_KEY" ] && [ -n "$API_KEY_ID" ] || { echo '::error::APPLE_API_KEY or APPLE_API_KEY_ID is missing; see macos/README.md.'; exit 1; }
            printf '%s' "$API_KEY" > "$credentials/AuthKey.p8"
            auth=(--key "$credentials/AuthKey.p8" --key-id "$API_KEY_ID")
            [ -z "$API_ISSUER_ID" ] || auth+=(--issuer "$API_ISSUER_ID")
          elif [ "$NOTARY_AUTH" = apple-id ]; then
            [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_PASSWORD" ] || {
              echo '::error::Configure APPLE_ID and APPLE_APP_SPECIFIC_PASSWORD in macos-release; see macos/README.md.'; exit 1; }
            auth=(--apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$EXPECTED_TEAM_ID")
          else
            echo '::error::APPLE_NOTARY_AUTH must be apple-id or api-key; see macos/README.md.'; exit 1
          fi
          xcrun notarytool store-credentials LoonInspect --keychain "$keychain" "${auth[@]}"
          rm -f "$credentials/signing.p12" "$credentials/AuthKey.p8"
          {
            echo "SIGN_IDENTITY=$identity"
            echo "SIGN_KEYCHAIN=$keychain"
            echo "NOTARY_KEYCHAIN=$keychain"
            echo 'NOTARY_PROFILE=LoonInspect'
          } >> "$GITHUB_ENV"

      - name: Build signed app and DMG
        run: macos/scripts/build-app.sh
      - name: Notarize, staple and verify app and DMG
        run: macos/scripts/notarize.sh
      - name: Save verified release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LoonInspect-${{ steps.source.outputs.version }}-arm64
          path: |
            macos/build/LoonInspect-*-arm64.dmg
            macos/build/LoonInspect-*-arm64.zip
            macos/build/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Save notarization responses for diagnosis
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-notarization-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            macos/build/notarize-*.json
            macos/build/notarize-*.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove temporary signing credentials
        if: always()
        run: |
          credentials="$RUNNER_TEMP/looninspect-signing"
          if [ -s "$credentials/original-keychains" ]; then
            keychains=()
            while IFS= read -r entry; do keychains+=("$entry"); done < "$credentials/original-keychains"
            security list-keychains -d user -s "${keychains[@]}" || true
          fi
          keychain="$credentials/signing.keychain-db"
          if [ -f "$keychain" ]; then security delete-keychain "$keychain" || true; fi
          rm -rf "$RUNNER_TEMP/looninspect-signing"

  draft:
    # The only job that writes to a release, and only to a draft: the signing job above holds
    # contents: read, and nothing here publishes. Publishing the draft is the repository admin's
    # act; it creates the tag and starts release.yml.
    name: Put the verified files on a draft release
    needs: notarize
    if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.notarize.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: LoonInspect-*-arm64
          path: ${{ runner.temp }}/assets
          merge-multiple: true
      - name: Verify checksums, then make the draft or refill this commit's draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ needs.notarize.outputs.sha }}
          ASSETS: ${{ runner.temp }}/assets
        run: macos/scripts/release-assets.sh draft

  published:
    # A published release takes no more files, so this cannot add the Mac app: it says whether
    # the release carries it, and what to do when it does not (docs/troubleshooting.md §25).
    name: The published release carries the Mac app
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The release holds the disk image, the zip and their sums, and they match
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: macos/scripts/release-assets.sh check
